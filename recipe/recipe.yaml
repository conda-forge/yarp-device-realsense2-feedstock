schema_version: 1

context:
  name: yarp-device-realsense2
  version: "0.5.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/robotology/yarp-device-realsense2/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 89efdbe50c45611ac416845b3e93084ea4daa0436349c9968c87a33a4efe1e13

build:
  number: 3

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - pkgconf
    - ninja
  host:
    - librealsense
    - libyarp

tests:
  - script:
      - if: not win
        then: test -f ${PREFIX}/lib/yarp/yarp_realsense2.so
      - if: not win
        then: test -f ${PREFIX}/lib/yarp/yarp_realsense2withIMU.so
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\yarp\\yarp_realsense2.dll exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\yarp\\yarp_realsense2withIMU.dll exit 1

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
  summary: realsense2 device for YARP.
  homepage: https://github.com/robotology/yarp-device-realsense2

extra:
  feedstock-name: yarp-device-realsense2
  recipe-maintainers:
    - Nicogene
    - traversaro
